<script>

AFRAME.registerComponent('crop-field', {

    init: function () {

        const root = this.el;

        /* LEFT FIELD */

        for(let row = 0; row < 7; row++){

            for(let col = 0; col < 15; col++){

                const crop = document.createElement('a-cone');

                crop.setAttribute(
                    'position',
                    `${-32 + col * 1.6} 0.9 ${-14 + row * 2.1}`
                );

                crop.setAttribute('radius-bottom','0.22');
                crop.setAttribute('radius-top','0.04');
                crop.setAttribute('height','1.8');

                crop.setAttribute(
                    'material',
                    'color:#d6a82d; roughness:0.8'
                );

                root.appendChild(crop);
            }
        }

        /* RIGHT FIELD */

        for(let row = 0; row < 7; row++){

            for(let col = 0; col < 13; col++){

                const crop = document.createElement('a-cone');

                crop.setAttribute(
                    'position',
                    `${8 + col * 1.6} 0.9 ${-14 + row * 2.1}`
                );

                crop.setAttribute('radius-bottom','0.22');
                crop.setAttribute('radius-top','0.04');
                crop.setAttribute('height','1.8');

                crop.setAttribute(
                    'material',
                    'color:#d6a82d; roughness:0.8'
                );

                root.appendChild(crop);
            }
        }

    }

});

</script>

<script>

AFRAME.registerComponent('tree', {

    init:function(){

        const root=this.el;

        const positions=[
            [-36,0,-25],
            [-27,0,-27],
            [-8,0,-26],
            [8,0,-27],
            [38,0,-27],
            [38,0,12],
            [-38,0,10],
            [-35,0,25],
            [35,0,25]
        ];

        positions.forEach(p=>{

            const trunk=document.createElement('a-cylinder');

            trunk.setAttribute(
                'position',
                `${p[0]} 2 ${p[2]}`
            );

            trunk.setAttribute('radius','0.7');
            trunk.setAttribute('height','4');
            trunk.setAttribute('color','#654321');

            root.appendChild(trunk);

            const leaves=document.createElement('a-sphere');

            leaves.setAttribute(
                'position',
                `${p[0]} 5 ${p[2]}`
            );

            leaves.setAttribute('radius','3');

            leaves.setAttribute(
                'material',
                'color:#3e7d35; roughness:1'
            );

            root.appendChild(leaves);

        });

    }

});

</script>

<!-- =========================================================
     WORKER SYSTEM
========================================================= -->

<script>

AFRAME.registerComponent('worker', {

    schema:{
        task:{type:'string'},
        color:{type:'string',default:'#c88755'},
        startX:{type:'number'},
        startZ:{type:'number'},
        workX:{type:'number'},
        workZ:{type:'number'},
        walk:{type:'boolean',default:false}
    },

    init:function(){

        const d=this.data;
        const el=this.el;

        const body=document.createElement('a-cylinder');

        body.setAttribute(
            'position',
            '0 1.7 0'
        );

        body.setAttribute('radius','0.42');
        body.setAttribute('height','1.7');

        body.setAttribute(
            'material',
            `color:${d.color}; roughness:0.8`
        );

        el.appendChild(body);


        const head=document.createElement('a-sphere');

        head.setAttribute(
            'position',
            '0 2.9 0'
        );

        head.setAttribute('radius','0.38');

        head.setAttribute(
            'material',
            'color:#8b5a3c'
        );

        el.appendChild(head);


        const hat=document.createElement('a-cylinder');

        hat.setAttribute(
            'position',
            '0 3.28 0'
        );

        hat.setAttribute('radius','0.52');
        hat.setAttribute('height','0.18');
        hat.setAttribute('color','#c39b4b');

        el.appendChild(hat);


        [-0.22,0.22].forEach(x=>{

            const leg=document.createElement('a-box');

            leg.setAttribute(
                'position',
                `${x} 0.65 0`
            );

            leg.setAttribute('width','0.25');
            leg.setAttribute('height','1.3');
            leg.setAttribute('depth','0.3');
            leg.setAttribute('color','#3e3e3e');

            el.appendChild(leg);

        });


        this.leftArm=document.createElement('a-box');

        this.leftArm.setAttribute(
            'position',
            '-0.65 1.9 0'
        );

        this.leftArm.setAttribute('width','0.22');
        this.leftArm.setAttribute('height','1.3');
        this.leftArm.setAttribute('depth','0.22');
        this.leftArm.setAttribute('color',d.color);

        el.appendChild(this.leftArm);


        this.rightArm=document.createElement('a-box');

        this.rightArm.setAttribute(
            'position',
            '0.65 1.9 0'
        );

        this.rightArm.setAttribute('width','0.22');
        this.rightArm.setAttribute('height','1.3');
        this.rightArm.setAttribute('depth','0.22');
        this.rightArm.setAttribute('color',d.color);

        el.appendChild(this.rightArm);


        el.setAttribute(
            'position',
            `${d.startX} 0 ${d.startZ}`
        );


        if(d.walk){

            setTimeout(()=>{

                el.setAttribute(
                    'animation__walk',
                    `
                    property:position;
                    to:${d.workX} 0 ${d.workZ};
                    dur:7000;
                    easing:easeInOutQuad;
                    loop:true;
                    dir:alternate
                    `
                );

            },500);

        }

        this.taskAnimation();

    },


    taskAnimation:function(){

        const task=this.data.task;


        if(task==='hoe'){

            this.leftArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:-45 0 25;
                to:70 0 25;
                dur:900;
                loop:true;
                dir:alternate
                `
            );

            this.rightArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:70 0 -25;
                to:-45 0 -25;
                dur:900;
                loop:true;
                dir:alternate
                `
            );
        }


        else if(task==='plant'){

            this.leftArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:10 0 20;
                to:85 0 20;
                dur:1200;
                loop:true;
                dir:alternate
                `
            );

            this.rightArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:10 0 -20;
                to:85 0 -20;
                dur:1200;
                loop:true;
                dir:alternate
                `
            );
        }


        else if(task==='water'){

            this.rightArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:-20 0 -30;
                to:80 0 -30;
                dur:1400;
                loop:true;
                dir:alternate
                `
            );

        }


        else if(task==='harvest'){

            this.leftArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:20 0 20;
                to:100 0 20;
                dur:1000;
                loop:true;
                dir:alternate
                `
            );

            this.rightArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:100 0 -20;
                to:20 0 -20;
                dur:1000;
                loop:true;
                dir:alternate
                `
            );
        }


        else if(task==='carry'){

            this.leftArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:0 0 15;
                to:20 0 15;
                dur:1200;
                loop:true;
                dir:alternate
                `
            );

            this.rightArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:0 0 -15;
                to:20 0 -15;
                dur:1200;
                loop:true;
                dir:alternate
                `
            );
        }


        else if(task==='pump'){

            this.rightArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:-70 0 0;
                to:60 0 0;
                dur:900;
                loop:true;
                dir:alternate
                `
            );
        }


        else if(task==='collect'){

            this.leftArm.setAttribute(
                'animation',
                `
                property:rotation;
                from:0 0 20;
                to:90 0 20;
                dur:1300;
                loop:true;
                dir:alternate
                `
            );
        }

    }

});

</script>
